spring:
  application:
    name: pdv-worker
  main:
    web-application-type: none
  rabbitmq:
    host: ${PDV_RABBITMQ_HOST:rabbitmq}
    port: ${PDV_RABBITMQ_PORT:5672}
    username: ${PDV_RABBITMQ_USER}
    password: ${PDV_RABBITMQ_PASSWORD}
    virtual-host: ${PDV_RABBITMQ_VHOST}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5s

pdv:
  simulated-payments:
    enabled: ${PDV_SIMULATED_PAYMENTS_ENABLED:false}
    interval-ms: 5000
    batch-size: 100
  reservation-expiry:
    enabled: ${PDV_RESERVATION_EXPIRY_ENABLED:false}
    interval-ms: 5000
    batch-size: 100
    schema: ${PDV_DB_SCHEMA:pdv}
  probe:
    prefix: ${PDV_PROBE_PREFIX:pdv.scaffold.probe}
    publish-timeout-ms: 5000
