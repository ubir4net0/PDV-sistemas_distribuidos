spring:
  application:
    name: pdv-api
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

server:
  address: 127.0.0.1
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
