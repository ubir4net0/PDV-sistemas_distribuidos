spring:
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  application:
    name: pdv-api
  datasource:
    url: ${PDV_DB_URL:jdbc:postgresql://127.0.0.1:55432/pdv}
    username: ${PDV_DB_USER}
    password: ${PDV_DB_PASSWORD}
    hikari:
      schema: pdv
  flyway:
    default-schema: pdv_migrations
    schemas: pdv_migrations
    locations: classpath:db/migration
    placeholders:
      applicationSchema: pdv
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
    validate-migration-naming: true
    validate-on-migrate: true
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

logging:
  level:
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.hibernate.orm.jdbc.error: "OFF"
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"

pdv:
  reservations:
    ttl-seconds: ${PDV_RESERVATION_TTL_SECONDS}
  auth:
    token-ttl-seconds: ${PDV_AUTH_TOKEN_TTL_SECONDS}

server:
  address: 127.0.0.1
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
    jmx:
      exposure:
        exclude: "*"
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
